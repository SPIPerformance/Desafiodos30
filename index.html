<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Comercial - Desafio dos 30 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#12201A;
    --ink-2:#1E2E26;
    --bg:#EEF2EF;
    --card:#FFFFFF;
    --line:#DCE5E0;
    --muted:#6B7A72;
    --brand:#00552F;      
    --brand-2:#006B3F;    
    --accent:#FF8B22;     
    --accent-soft:#FFE7CF;
    --red:#E5484D;
    --amber:#FFC93C;
    --green:#006B3F;
    --green-soft:#DCEFE3;
    --red-soft:#FBE0E1;
    --radius:10px;
    --shadow:0 1px 2px rgba(18,32,26,0.06), 0 4px 16px rgba(18,32,26,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--ink) 0%, var(--brand) 100%);
    color:#fff;
    padding:22px 28px 60px 28px;
    position:relative;
    overflow:hidden;
  }
  .topbar::before{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:340px; height:340px;
    background:radial-gradient(circle, rgba(255,139,34,0.20) 0%, rgba(255,139,34,0) 70%);
  }
  .topbar-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap:wrap; gap:16px; position:relative; z-index:1;
  }
  .brand-block .eyebrow{
    text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--accent);
    font-weight:700; margin-bottom:6px;
  }
  .brand-block h1{
    font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700;
    margin:0 0 4px 0; letter-spacing:-0.01em;
  }
  .brand-block .sub{ color:#CBE0D2; font-size:13px; }
  .top-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .canal-toggle{
    display:flex; flex-wrap:wrap; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
    border-radius:999px; padding:4px; gap:2px;
  }
  .canal-toggle button{
    border:none; background:transparent; color:#CFE0D6; font-family:'Inter';
    font-weight:600; font-size:12px; padding:8px 15px; border-radius:999px; cursor:pointer;
    white-space:nowrap; transition:all .18s ease;
  }
  .canal-toggle button.active{ background:var(--accent); color:#291200; }
  .canal-toggle button:hover:not(.active){ color:#fff; }

  .btn-ghost{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff;
    font-size:13px; font-weight:600; padding:10px 16px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:8px; font-family:'Inter';
  }
  .btn-ghost:hover{ background:rgba(255,255,255,0.16); }
  #fileInput{ display:none; }
  .upload-status{ font-size:11px; color:#CBE0D2; margin-top:6px; text-align:right; }

  .funnel-glyph{ display:flex; align-items:flex-end; gap:3px; height:20px; }
  .funnel-glyph span{ display:block; width:5px; background:var(--accent); border-radius:1px; }

  /* ---------- CONTAINER ---------- */
  .wrap{ max-width:1440px; margin:-38px auto 60px auto; padding:0 28px; position:relative; z-index:2; }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px;
  }
  .kpi-card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px 18px; border:1px solid var(--line);
    border-top:3px solid var(--brand-2);
  }
  .kpi-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; margin-bottom:8px;}
  .kpi-card .value{ font-family:'Space Grotesk'; font-size:26px; font-weight:700; color:var(--ink); line-height:1;}
  .kpi-card .value .unit{ font-size:14px; font-weight:600; color:var(--muted); margin-left:3px;}

  /* ---------- FILTER BAR ---------- */
  .filter-bar{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 18px; margin-bottom:18px;
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700;}
  .field input[type=text], .field select, .field input[type=number]{
    border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
    font-family:'Inter'; background:#FAFBFA; min-width:120px; color:var(--ink);
  }
  .field input[type=number]{ width:70px; }
  .field input:focus, .field select:focus{ outline:2px solid var(--brand-2); outline-offset:1px; }
  .chip-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line); background:#FAFBFA; border-radius:999px; padding:6px 13px;
    font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-2); transition:all .15s;
  }
  .chip.active{ background:var(--brand-2); color:#fff; border-color:var(--brand-2); }
  .spacer{ flex:1; }
  .result-count{ font-size:12px; color:var(--muted); font-weight:600; }
  .meta-note{ font-size:10.5px; color:var(--accent); font-weight:700; margin-top:2px; }

  /* ---------- TABLE ---------- */
  .table-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .table-scroll{ }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  table{ width:100%; border-collapse:collapse; min-width:920px; }
  thead th{
    position:sticky; top:0; background:var(--brand); color:#fff; z-index:3;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
    padding:12px 10px; text-align:center; white-space:nowrap; cursor:pointer; user-select:none;
    border-bottom:2px solid var(--accent);
  }
  thead th.left{ text-align:left; }
  thead th:hover{ background:var(--brand-2); }
  thead th .arrow{ font-size:9px; margin-left:3px; opacity:.85; }
  tbody tr.data-row{ border-bottom:1px solid var(--line); transition:background .1s; cursor:pointer; }
  tbody tr.data-row:hover{ background:#F3F8F5; }
  tbody tr.expanded{ background:#EFF6F1; }
  tbody td{ padding:10px 10px; font-size:13px; text-align:center; white-space:nowrap; }
  tbody td.left{ text-align:left; font-weight:600; color:var(--ink-2); }
  .heat{ border-radius:6px; padding:4px 8px; display:inline-block; min-width:56px; font-weight:700; font-family:'IBM Plex Mono'; font-size:12.5px;}
  .gap-pos{ color:#0F6B3D; }
  .gap-neg{ color:#B42318; }
  .rank{ font-family:'IBM Plex Mono'; color:var(--muted); font-size:11.5px; width:26px; }
  .reg-pill{
    font-size:10.5px; font-weight:700; color:var(--brand-2); background:var(--green-soft);
    border-radius:5px; padding:3px 7px; white-space:nowrap;
  }
  .name-row{ display:flex; align-items:center; gap:8px; }
  .caret{ font-size:9px; color:var(--muted); transition:transform .15s; display:inline-block; }
  tr.expanded .caret{ transform:rotate(90deg); }

  /* ---------- DROPDOWN RANKINGS ---------- */
  .dropdown {
    position: relative;
    display: inline-block;
  }
  .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    background-color: var(--card);
    min-width: 190px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    border-radius: 8px;
    z-index: 50;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .dropdown-content.show {
    display: flex;
    flex-direction: column;
  }
  .dropdown-content button {
    color: var(--ink);
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    border: none;
    background: transparent;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.1s;
  }
  .dropdown-content button:hover {
    background-color: #F3F8F5;
  }
  .dropdown-content button.active {
    background-color: var(--green-soft);
    color: var(--brand-2);
  }

  /* ---------- EXPANDED DETAIL ---------- */
  tr.detail-row td{ cursor:default; padding:0; }
  .detail-inner{ padding:28px 30px 34px 30px; background:#F7FAF8; border-bottom:1px solid var(--line); }
  .funnel-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:20px;}
  .detail-lower{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .stat-box .l{ font-size:10.5px; text-transform:uppercase; color:var(--muted); font-weight:700; letter-spacing:.05em;}
  .stat-box .v{ font-family:'Space Grotesk'; font-size:20px; font-weight:700; margin-top:4px;}

  .detail-split{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); gap:32px; align-items:start; }
  .detail-split > div{ min-width:0; }
  .vfunnel{ display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 14px; }
  .vfunnel-row{ display:grid; grid-template-columns:82px 1fr 44px; align-items:center; gap:8px; padding:2px 0; }
  .vfunnel-label{ font-size:10px; color:var(--muted); font-weight:700; text-align:right; line-height:1.2; }
  .vfunnel-barwrap{ background:#E6ECE8; border-radius:4px; height:16px; overflow:hidden; }
  .vfunnel-bar{ height:100%; border-radius:4px; background:var(--brand-2); min-width:3px; transition:width .2s; }
  .vfunnel-bar.first{ background:var(--ink); }
  .vfunnel-count{ font-family:'IBM Plex Mono'; font-weight:700; font-size:11px; color:var(--ink); text-align:right; }
  .vfunnel-conv{ display:grid; grid-template-columns:82px 1fr 44px; gap:8px; }
  .vfunnel-conv span{ grid-column:2; text-align:center; font-size:9px; font-weight:700; color:var(--accent); }
  .right-col{ display:flex; flex-direction:column; gap:22px; min-width:0; }
  .corretor-wrap{ min-width:0; max-width:100%; overflow-x:auto; }
  .corretor-table{ width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed; min-width:0; }
  .corretor-table th{ text-align:left; color:var(--muted); font-weight:700; font-size:10.5px; text-transform:uppercase; padding:6px 10px; border-bottom:1px solid var(--line);}
  .corretor-table td{ padding:7px 10px; border-bottom:1px solid #EEF1EE; overflow-wrap:anywhere; }
  .corretor-table tr:last-child td{ border-bottom:none; }

  .cmp-badge{
    display:inline-block; border-radius:999px; padding:3px 7px; font-size:10px; font-weight:700;
    white-space:nowrap;
  }
  .cmp-up{ background:var(--green-soft); color:#0F6B3D; }
  .cmp-down{ background:var(--red-soft); color:#B42318; }
  .cmp-flat{ background:#EEF1EE; color:var(--muted); }

  .legend{ display:flex; gap:16px; align-items:center; margin:14px 2px 0 2px; font-size:11px; color:var(--muted); flex-wrap:wrap;}
  .legend-swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-2px;}
  footer{ text-align:center; font-size:11px; color:var(--muted); padding:20px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:8px;
    font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.28);
    z-index:10001; opacity:0; pointer-events:none; transition:opacity .25s;
    max-width:80vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  @media (max-width:900px){
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
    .detail-lower{ grid-template-columns:1fr 1fr; }
    .detail-split{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="appRoot">

<div class="topbar">
  <div class="topbar-row">
    <div class="brand-block">
      <div class="eyebrow">Diretoria Comercial · SPI · MRV</div>
      <h1>Painel de Performance Comercial</h1>
      <div class="sub" id="subLabel">Carregando painel...</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
      <div class="top-actions">
        <div class="canal-toggle" style="margin-right: 6px;">
          <button id="btnHouse" class="">Canal House</button>
          <button id="btnImob" class="active">Canal Imob</button>
        </div>
        
        <!-- SELETOR DE MÊS -->
        <select id="monthSelector" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; font-size:13px; font-weight:600; padding:9px 12px; border-radius:8px; cursor:pointer; font-family:'Inter'; outline:none; margin-right: 6px;">
        </select>

        <div class="dropdown">
          <button class="btn-ghost" id="btnRankMenu">📊 Rankings ▼</button>
          <div id="rankDropdown" class="dropdown-content">
            <button id="btnRankHouse">🏆 Ranking Gerentes</button>
            <button id="btnRankImob">🏆 Ranking Supervisores</button>
          </div>
        </div>
        <button class="btn-ghost" id="btnUpload" style="display: none;">
          <span class="funnel-glyph"><span style="height:6px"></span><span style="height:11px"></span><span style="height:16px"></span></span>
          Atualizar planilha (teste local)
        </button>
        <button class="btn-ghost" id="btnCopyImage" style="display:none; background:rgba(255,139,34,0.16); border-color:rgba(255,139,34,0.4);">
          📋 Copiar imagem do ranking
        </button>
        <input type="file" id="fileInput" accept=".xlsx,.xls">
      </div>
      <div class="upload-status" id="uploadStatus">Aguardando dados...</div>
    </div>
  </div>
</div>

<div class="wrap">

  <div id="captureArea">
    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="filter-bar" id="filterBar" style="display: flex;">
      <div class="field">
        <label>Buscar nome</label>
        <input type="text" id="searchInput" placeholder="Digite um nome...">
      </div>
      <div class="field">
        <label>Regional</label>
        <div class="chip-group" id="regionalChips"></div>
      </div>
      <div class="field">
        <label id="metaLabel">Meta CPF Aprov./Cond.</label>
        <input type="number" id="metaInput" min="0">
        <span class="meta-note" id="metaNote">Meta automática...</span>
      </div>
      <div class="spacer"></div>
      <div class="result-count" id="resultCount"></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="mainTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-swatch" style="background:#E5484D"></span>Abaixo do esperado</span>
    <span><span class="legend-swatch" style="background:#FFC93C"></span>Intermediário</span>
    <span><span class="legend-swatch" style="background:#006B3F"></span>Bom desempenho</span>
  </div>

</div>

<footer>Painel alimentado automaticamente pelo .xlsx "Dados" hospedado no GitHub.</footer>

</div>

<!-- DEFAULT DATA VAZIO PARA FICAR LEVE -->
<script id="default-data" type="application/json">
{"house":[],"imob":[],"stages":["LEAD","DOC_ENVIADA","DOC_ANALISE","CPF_ANALISADO","CPF_APROVADO","CONTRATO_GERADO","CONTRATO_ASSINADO","REPASSE","GANHO","REGISTRO"],"stage_labels":{"LEAD":"Lead","DOC_ENVIADA":"Doc. Enviada","DOC_ANALISE":"Doc. em Análise","CPF_ANALISADO":"CPF Analisado","CPF_APROVADO":"CPF Aprov./Cond.","CONTRATO_GERADO":"Contrato Gerado","CONTRATO_ASSINADO":"Contrato Assinado","REPASSE":"Repasse","GANHO":"Ganho","REGISTRO":"Registro"},"available_months":[]}
</script>

<script>
/* ============================================================
   FONTE DE DADOS EXTERNA (GitHub)
=============================================================*/
const DATA_URL = 'https://raw.githubusercontent.com/SPIPerformance/Desafiodos30/main/Dados.xlsx';

const RAW_READY = (async function loadRemoteData(){
  const fallback = JSON.parse(document.getElementById('default-data').textContent);
  if(!DATA_URL || DATA_URL.indexOf('COLE_AQUI') !== -1){
    return { data: fallback, source: 'fallback', reason: 'DATA_URL não configurada' };
  }
  try{
    const res = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const arrayBuffer = await res.arrayBuffer();
    const data = parseWorkbook(arrayBuffer);
    if(!data || (data.house.length===0 && data.imob.length===0)){
      throw new Error('Nenhum dado reconhecido no .xlsx remoto');
    }
    return { data, source: 'github', reason: null };
  }catch(err){
    return { data: fallback, source: 'fallback', reason: (err && err.message) ? err.message : String(err) };
  }
})();

/* ============================================================
   APP INITIALIZATION
=============================================================*/
(async function startApp(){
  const loaded = await RAW_READY;
  RAW = loaded.data;
  window.__DATA_SOURCE__ = loaded;
  STAGES = RAW.stages;
  LABELS = RAW.stage_labels;
  initApp();
})();

let RAW = null; 
let CANAL = 'house'; 
let sortKey = 'CPF_APROVADO';
let sortDir = -1;
let expandedRow = null;
let regionalFilter = 'ALL';
let searchTerm = '';
let removedNames = { house: new Set(), imob: new Set() }; 

const today = new Date();
let meta = Math.max(0, today.getDate() - 1);

let STAGES = null;
let LABELS = null;

const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function monthKeyFromDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function addMonths(monthKey, delta){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthKeyFromDate(d);
}
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return `${MESES_PT[m-1].charAt(0).toUpperCase()+MESES_PT[m-1].slice(1)}/${y}`;
}

let CURRENT_MONTH = monthKeyFromDate(today);
let PREV_3_MONTHS = [addMonths(CURRENT_MONTH,-3), addMonths(CURRENT_MONTH,-2), addMonths(CURRENT_MONTH,-1)];

function emptyStagesRow(){
  const o = {};
  STAGES.forEach(s=> o[s]=0);
  return o;
}
function flattenEntry(entry, monthKey, isHouse){
  const stagesRow = (entry.months && entry.months[monthKey]) ? entry.months[monthKey] : emptyStagesRow();
  const row = Object.assign({ nome: entry.nome, regional: entry.regional }, stagesRow);
  if(isHouse){
    const eq = (entry.equipe_por_mes && entry.equipe_por_mes[monthKey]) || {total:0, inativos:0, ativa:0};
    row.equipe_total = eq.total || 0;
    row.equipe_inativos = eq.inativos || 0;
    row.equipe_ativa = eq.ativa || 0;
    row.vendas = (entry.vendas_por_mes && entry.vendas_por_mes[monthKey]) || 0;
    row.equipe_produtiva = (entry.produtivos_por_mes && entry.produtivos_por_mes[monthKey]) || 0;
    row.corretores = (entry.corretores_por_mes && entry.corretores_por_mes[monthKey]) || [];
  } else {
    row.vendas = (entry.vendas_por_mes && entry.vendas_por_mes[monthKey]) || 0;
  }
  return row;
}
function getMonthRows(canal, monthKey){
  const isHouse = canal === 'house';
  return RAW[canal].map(entry => flattenEntry(entry, monthKey, isHouse));
}
function findEntry(canal, nome){
  return RAW[canal].find(e => e.nome === nome);
}
function computeAvgPrev3(entry, isHouse){
  const rows = PREV_3_MONTHS.map(mk => flattenEntry(entry, mk, isHouse));
  const avg = {};
  STAGES.forEach(s=>{ avg[s] = (rows[0][s]+rows[1][s]+rows[2][s]) / 3; });
  avg.vendas = (rows[0].vendas+rows[1].vendas+rows[2].vendas) / 3;
  return avg;
}

function pct(a,b){ if(!b) return null; return (a/b)*100; }
function fmtPct(v){ return v===null ? '—' : v.toFixed(1).replace('.', ',') + '%'; }
function fmtInt(v){ return (v||0).toLocaleString('pt-BR'); }
function limitName(fullName, maxWords){
  if(!fullName) return '';
  maxWords = maxWords || 3;
  const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
  if(parts.length <= maxWords) return fullName;
  let limit = maxWords;
  const preposicoes = new Set(['de', 'da', 'do', 'das', 'dos', 'e']);
  if (preposicoes.has(parts[limit - 1].toLowerCase()) && parts.length > limit) { limit++; }
  return parts.slice(0, limit).join(' ');
}
function shortName(fullName){
  if(!fullName) return '';
  const stopWords = new Set(['de','da','do','dos','das','e']);
  const parts = String(fullName).trim().split(/\s+/).filter(Boolean);
  if(parts.length <= 1) return parts[0] || '';
  const first = parts[0];
  let second = null;
  for(let i=1; i<parts.length; i++){
    if(!stopWords.has(parts[i].toLowerCase())){
      second = parts[i];
      break;
    }
  }
  if(!second) second = parts[parts.length-1];
  return `${first} ${second}`;
}

function heatColor(p, redMax, greenMin){
  if(p===null) return {bg:'#F1F3F1', fg:'#8A968E'};
  let t = (p - redMax) / (greenMin - redMax);
  t = Math.max(0, Math.min(1, t));
  const stops = [{t:0, c:[229,72,77]}, {t:0.5, c:[255,201,60]}, {t:1, c:[0,107,63]}];
  let c1, c2, localT;
  if(t <= 0.5){ c1=stops[0]; c2=stops[1]; localT = t/0.5; }
  else { c1=stops[1]; c2=stops[2]; localT = (t-0.5)/0.5; }
  let r = Math.round(c1.c[0] + (c2.c[0]-c1.c[0])*localT);
  let g = Math.round(c1.c[1] + (c2.c[1]-c1.c[1])*localT);
  let b = Math.round(c1.c[2] + (c2.c[2]-c1.c[2])*localT);
  return {bg:`rgba(${r},${g},${b},0.16)`, fg:`rgb(${Math.round(r*0.62)},${Math.round(g*0.55)},${Math.round(b*0.6)})`};
}

function renderTable(rows){
  const cols = getColumns();
  const head = document.getElementById('tableHead');
  
  head.innerHTML = '<th style="width:34px"></th>' + cols.map(c=>{
    let arrow = '';
    if(sortKey===c.key) arrow = `<span class="arrow">${sortDir===1?'▲':'▼'}</span>`;
    return `<th class="${c.left?'left':''}" data-key="${c.key}">${c.label}${arrow}</th>`;
  }).join('');

  head.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if(sortKey===k) sortDir *= -1; else { sortKey=k; sortDir=-1; }
      renderTable(getFilteredRows());
    });
  });

  const enriched = rows.map(r=>{
    const e = Object.assign({}, r);
    cols.forEach(c=>{ if(c.compute) e['_'+c.key] = c.compute(r); });
    return e;
  });

  enriched.sort((a,b)=>{
    if(sortKey==='nome' || sortKey==='regional'){
      return sortDir * String(a[sortKey]).localeCompare(String(b[sortKey]));
    }
    let av = a['_'+sortKey] !== undefined ? a['_'+sortKey] : a[sortKey];
    let bv = b['_'+sortKey] !== undefined ? b['_'+sortKey] : b[sortKey];
    av = av===null||av===undefined ? -Infinity : av;
    bv = bv===null||bv===undefined ? -Infinity : bv;
    return sortDir * (av - bv);
  });

  const body = document.getElementById('tableBody');
  let html = '';
  enriched.forEach((r, idx)=>{
    const isExpanded = expandedRow === r.nome;
    html += `<tr class="data-row ${isExpanded?'expanded':''}" data-name="${r.nome}">`;
    html += `<td class="rank">${idx+1}</td>`;
    cols.forEach(c=>{
      if(c.key==='regional'){
        html += `<td><span class="reg-pill">${r.regional}</span></td>`;
      } else if(c.left){
        html += `<td class="left"><span class="name-row"><span class="caret">▶</span>${limitName(r.nome)}</span></td>`;
      } else if(c.isHeat){
        const v = c.compute(r);
        const col = heatColor(v===null?null:v, c.range[0], c.range[1]);
        html += `<td><span class="heat" style="background:${col.bg}; color:${col.fg}">${fmtPct(v)}</span></td>`;
      } else if(c.isGap){
        const v = c.compute(r);
        const cls = v>=0 ? 'gap-pos' : 'gap-neg';
        html += `<td class="mono ${cls}" style="font-weight:700;">${v>0?'+':''}${v}</td>`;
      } else {
        html += `<td class="mono">${c.render(r)}</td>`;
      }
    });
    html += `</tr>`;
    if(isExpanded){
      html += renderDetailRow(r, cols.length+1);
    }
  });
  body.innerHTML = html;

  body.querySelectorAll('tr.data-row').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const name = tr.dataset.name;
      expandedRow = expandedRow === name ? null : name;
      renderTable(getFilteredRows());
    });
  });

  document.getElementById('resultCount').textContent = `${rows.length} ${CANAL==='house'?'gerentes':'supervisores'} exibidos`;
}

function renderVerticalFunnel(r){
  const baseline = Math.max(r[STAGES[0]], 1); 
  let html = '<div class="vfunnel">';
  STAGES.forEach((s, i)=>{
    const val = r[s];
    const widthPct = Math.max(2, (val/baseline)*100);
    html += `<div class="vfunnel-row">
      <div class="vfunnel-label">${LABELS[s]}</div>
      <div class="vfunnel-barwrap"><div class="vfunnel-bar ${i===0?'first':''}" style="width:${widthPct}%"></div></div>
      <div class="vfunnel-count">${fmtInt(val)}</div>
    </div>`;
    if(i < STAGES.length - 1){
      const nextVal = r[STAGES[i+1]];
      const c = pct(nextVal, val);
      html += `<div class="vfunnel-conv"><span>↓ ${c===null?'—':c.toFixed(0)+'%'}</span></div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderComparativo(r){
  const isHouse = CANAL === 'house';
  const entry = findEntry(CANAL, r.nome);
  if(!entry) return '';
  const avg3 = computeAvgPrev3(entry, isHouse);

  const metrics = isHouse
    ? [['Leads','LEAD'], ['Doc. Enviada','DOC_ENVIADA'], ['CPF Aprov./Cond.','CPF_APROVADO'], ['Vendas','vendas']]
    : [['Doc. Enviada','DOC_ENVIADA'], ['CPF Aprov./Cond.','CPF_APROVADO'], ['Vendas','vendas']];

  function badge(curr, avgv){
    if(avgv === 0 && curr === 0) return `<span class="cmp-badge cmp-flat">estável</span>`;
    if(avgv === 0) return `<span class="cmp-badge cmp-up">▲ novo</span>`;
    const deltaPct = ((curr - avgv) / avgv) * 100;
    const up = deltaPct >= 0;
    return `<span class="cmp-badge ${up?'cmp-up':'cmp-down'}">${up?'▲':'▼'} ${Math.abs(deltaPct).toFixed(0)}% ${up?'melhora':'piora'}</span>`;
  }

  const rowsHtml = metrics.map(([label, key])=>{
    const curr = r[key];
    const avgv = avg3[key];
    return `<tr>
      <td>${label}</td>
      <td style="text-align:right; font-family:'IBM Plex Mono'; font-weight:700;">${fmtInt(curr)}</td>
      <td style="text-align:right; font-family:'IBM Plex Mono'; color:var(--muted);">${avgv.toFixed(1).replace('.',',')}</td>
      <td style="text-align:right;">${badge(curr, avgv)}</td>
    </tr>`;
  }).join('');

  return `
    <div class="corretor-wrap">
      <div class="funnel-title" style="margin-bottom:10px;">
        Comparativo — ${monthLabel(CURRENT_MONTH)} vs. média de ${PREV_3_MONTHS.map(monthLabel).join(', ')}
      </div>
      <table class="corretor-table">
        <thead><tr><th style="width:30%">Indicador</th><th style="width:19%; text-align:right">${monthLabel(CURRENT_MONTH)}</th><th style="width:19%; text-align:right">Média 3M</th><th style="width:32%; text-align:right">Variação</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

const HIDDEN_NAMES = { house: ['ANDRÉ'], imob: ['KAUE DA SILVA ROSA'] };
function normalizeName(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim(); }
function isHiddenByCode(baseCanal, nome){
  const list = HIDDEN_NAMES[baseCanal] || [];
  const nameTokens = normalizeName(nome).split(/\s+/).filter(Boolean);
  return list.some(h => {
    const hTokens = normalizeName(h).split(/\s+/).filter(Boolean);
    if(hTokens.length > nameTokens.length) return false;
    return hTokens.every((t, i) => nameTokens[i] === t);
  });
}

function getActiveRows(baseCanal){
  const prevMonth = PREV_3_MONTHS[2]; 
  return getMonthRows(baseCanal, CURRENT_MONTH).filter(r => {
    if(removedNames[baseCanal].has(r.nome)) return false;
    if(isHiddenByCode(baseCanal, r.nome)) return false;
    const entry = findEntry(baseCanal, r.nome);
    if(!entry || !entry.months) return false;
    const currentData = entry.months[CURRENT_MONTH] || {};
    const prevData = entry.months[prevMonth] || {};
    const hasCurrentMovement = STAGES.some(s => (currentData[s] || 0) > 0);
    const hasPrevMovement = STAGES.some(s => (prevData[s] || 0) > 0);
    return hasCurrentMovement || hasPrevMovement;
  });
}

function getFilteredRows(){
  let rows = getActiveRows(CANAL);

const FUNNEL_MAP = {
  'LEAD':'LEAD', 'DOCUMENTAÇÃO ENVIADA':'DOC_ENVIADA', 'DOCUMENTAÇÃO EM ANÁLISE':'DOC_ANALISE',
  'DOCUMENTAÇÃO COM PENDÊNCIA':'DOC_ANALISE', 'CPF ANALISADO':'CPF_ANALISADO',
  'CPF ANALISADO COM PENDÊNCIA':'CPF_ANALISADO', 'CPF APROVADO':'CPF_APROVADO',
  'CPF APROVADO COM PENDÊNCIA':'CPF_APROVADO', 'CPF CONDICIONADO':'CPF_APROVADO',
  'CPF CONDICIONADO COM PENDÊNCIA':'CPF_APROVADO', 'CONTRATO GERADO':'CONTRATO_GERADO',
  'CONTRATO ASSINADO':'CONTRATO_ASSINADO', 'REPASSE':'REPASSE', 'GANHO':'GANHO', 'REGISTRO':'REGISTRO'
};

const MESES_ABREV_JS = {jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12'};

function parseExcelDate(val) {
    if (val === null || val === undefined) return null;
    if (typeof val === 'number') {
        const d = new Date(Math.round((val - 25569) * 86400 * 1000));
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
    }
    let s = String(val).trim().toLowerCase();

    // Caso 1: DD/MM/YYYY
    if (s.match(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/)) {
        let [d, m, y] = s.split('/');
        if (y.length === 2) y = '20' + y;
        return `${y}-${m.padStart(2, '0')}`;
    }

    // Caso 2: MMM/YYYY
    if (s.match(/^[a-z]{3}\/\d{2,4}$/)) {
        let [mmm, y] = s.split('/');
        if (y.length === 2) y = '20' + y;
        let m = MESES_ABREV_JS[mmm.substring(0,3)];
        if (m) return `${y}-${m}`;
    }

    // Caso 3: YYYY-MM-DD
    if (s.match(/^\d{4}-\d{2}-\d{2}/)) {
        return s.substring(0, 7);
    }

    return s;
}

function parseWorkbook(ab){
  const wb = XLSX.read(ab, {type:'array'});
  const sheetName = wb.SheetNames.find(n => n.trim().toLowerCase() === 'td painel') || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];

  if (ws['!ref']) {
    const range = XLSX.utils.decode_range(ws['!ref']);
    range.s.c = 0; 
    range.s.r = 0; 
    ws['!ref'] = XLSX.utils.encode_range(range);
  }

  const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});

  // Busca Inteligente de Cabeçalhos
  let headerRowIdx = -1;
  let colMap = {};
  for(let r=0; r < Math.min(20, grid.length); r++) {
      const row = grid[r] || [];
      let map = {};
      let matches = 0;
      for(let c=0; c < row.length; c++) {
          if(row[c] && typeof row[c] === 'string') {
              let val = row[c].trim();
              map[val] = c;
              if(['data_base', 'DataBase', 'canal_loja', 'gerente', '# Vendas', 'Funil_Real'].includes(val)) {
                  matches++;
              }
          }
      }
      if(matches >= 3) {
          headerRowIdx = r;
          colMap = map;
          break;
      }
  }

  if(headerRowIdx === -1) headerRowIdx = 7; 

  const C_db = colMap['data_base'] !== undefined ? colMap['data_base'] : 2;
  const C_canal = colMap['canal_loja'] !== undefined ? colMap['canal_loja'] : 3;
  const C_ger = colMap['gerente'] !== undefined ? colMap['gerente'] : 4;
  const C_sup = colMap['supervisor_imob'] !== undefined ? colMap['supervisor_imob'] : 5;
  const C_corr = colMap['nom_corretor'] !== undefined ? colMap['nom_corretor'] : 6;
  const C_status = colMap['status_funil'] !== undefined ? colMap['status_funil'] : 7;
  const C_reg = colMap['regional'] !== undefined ? colMap['regional'] : 8;
  const C_val = colMap['Funil_Real'] !== undefined ? colMap['Funil_Real'] : 9;

  const C_db2 = colMap['DataBase'] !== undefined ? colMap['DataBase'] : 12;
  const C_reg2 = colMap['regional_co'] !== undefined ? colMap['regional_co'] : 13;
  const C_ger2 = colMap['nom_gerente'] !== undefined ? colMap['nom_gerente'] : 14;
  const C_tot = colMap['TotalCorretores'] !== undefined ? colMap['TotalCorretores'] : 15;
  const C_inativos = colMap['TotalCorretoresMais10DiasSemLogin'] !== undefined ? colMap['TotalCorretoresMais10DiasSemLogin'] : 16;

  const C_db3 = colMap['DataBaseAssinaturaContratoSalesforce'] !== undefined ? colMap['DataBaseAssinaturaContratoSalesforce'] : 17;
  const C_ger3 = colMap['NomeGerente'] !== undefined ? colMap['NomeGerente'] : 18;
  const C_corr3 = colMap['NomeCorretor'] !== undefined ? colMap['NomeCorretor'] : 19;
  const C_loja3 = colMap['NomeLoja'] !== undefined ? colMap['NomeLoja'] : 20;
  const C_vendas = colMap['# Vendas'] !== undefined ? colMap['# Vendas'] : 21;

  const house = {};
  const imob = {};
  function ensure(map, name){ if(!map[name]) map[name] = {regional:null, months:{}}; return map[name]; }
  function ensureMonth(entry, mk){ if(!entry.months[mk]) entry.months[mk] = {}; STAGE_KEYS.forEach(s=>{ if(entry.months[mk][s]===undefined) entry.months[mk][s]=0; }); return entry.months[mk]; }

  // Forward Fill Variables (Preenchimento Automático)
  let last_db = null, last_canal = null, last_ger = null, last_sup = null, last_corr = null, last_reg = null;
  let last_db2 = null, last_reg2 = null, last_ger2 = null;
  let last_db3 = null, last_ger3 = null, last_corr3 = null, last_loja3 = null;

  const equipe = {};
  const vendasPorNomeMes = {};
  const lojaPorNome = {};
  const parentPorNomeMes = {};

  for(let r = headerRowIdx + 1; r < grid.length; r++) {
      const row = grid[r] || [];
      if(row.length === 0) continue;

      const isTotal1 = String(row[C_db] || '').includes('Total Geral') || String(row[C_canal] || '').includes('Total Geral');
      const isTotal2 = String(row[C_db2] || '').includes('Total Geral');
      const isTotal3 = String(row[C_db3] || '').includes('Total Geral');

      // Tabela 1: Funil
      if(!isTotal1) {
          if(row[C_db] !== undefined && row[C_db] !== null && row[C_db] !== '') last_db = row[C_db];
          if(row[C_canal] !== undefined && row[C_canal] !== null && row[C_canal] !== '') last_canal = row[C_canal];
          if(row[C_ger] !== undefined && row[C_ger] !== null && row[C_ger] !== '') last_ger = row[C_ger];
          if(C_sup !== undefined && row[C_sup] !== undefined && row[C_sup] !== null && row[C_sup] !== '') last_sup = row[C_sup];
          if(C_corr !== undefined && row[C_corr] !== undefined && row[C_corr] !== null && row[C_corr] !== '') last_corr = row[C_corr];
          if(row[C_reg] !== undefined && row[C_reg] !== null && row[C_reg] !== '') last_reg = row[C_reg];

          const rawStatus = row[C_status];
          if(rawStatus) {
              const status = String(rawStatus).replace(/^\+\s*/, '').trim().toUpperCase();
              if(FUNNEL_MAP[status]) {
                  const mk = parseExcelDate(last_db);
                  const canal = String(last_canal || '').replace(/^\+\s*/, '').trim().toUpperCase();
                  const gerente = String(last_ger || '').replace(/^\+\s*/, '').trim();
                  const supervisor = String(last_sup || '').replace(/^\+\s*/, '').trim();
                  const regional = String(last_reg || row[C_reg] || '').replace(/^\+\s*/, '').trim();
                  const valor = row[C_val] || 0;
                  const stage = FUNNEL_MAP[status];

                  if(mk && canal === 'HOUSE' && gerente) {
                      const o = ensure(house, gerente);
                      if(regional) o.regional = regional;
                      const ms = ensureMonth(o, mk); ms[stage] = (ms[stage]||0) + valor;
                  } else if(mk && canal === 'IMOB' && supervisor) {
                      const o = ensure(imob, supervisor);
                      if(regional) o.regional = regional;
                      const ms = ensureMonth(o, mk); ms[stage] = (ms[stage]||0) + valor;
                  }
              }
          }
      }

      // Tabela 2: Equipe
      if(!isTotal2) {
          if(row[C_db2] !== undefined && row[C_db2] !== null && row[C_db2] !== '') last_db2 = row[C_db2];
          if(row[C_reg2] !== undefined && row[C_reg2] !== null && row[C_reg2] !== '') last_reg2 = row[C_reg2];
          if(row[C_ger2] !== undefined && row[C_ger2] !== null && row[C_ger2] !== '') last_ger2 = row[C_ger2];

          const tot = row[C_tot];
          const tot10 = row[C_inativos];

          if(tot !== undefined && tot !== null && last_ger2 && last_db2) {
              const mk = parseExcelDate(last_db2);
              const g = String(last_ger2).replace(/^\+\s*/, '').trim();
              if(mk && g) {
                  if(!equipe[g]) equipe[g] = {};
                  equipe[g][mk] = {total: tot || 0, inativos: tot10 || 0, ativa: (tot||0) - (tot10||0)};
              }
          }
      }

      // Tabela 3: Vendas
      if(!isTotal3) {
          if(row[C_db3] !== undefined && row[C_db3] !== null && row[C_db3] !== '') last_db3 = row[C_db3];
          if(row[C_ger3] !== undefined && row[C_ger3] !== null && row[C_ger3] !== '') last_ger3 = row[C_ger3];
          if(row[C_corr3] !== undefined && row[C_corr3] !== null && row[C_corr3] !== '') last_corr3 = row[C_corr3];
          if(row[C_loja3] !== undefined && row[C_loja3] !== null && row[C_loja3] !== '') last_loja3 = row[C_loja3];

          const vendas = row[C_vendas];
          if(vendas !== undefined && vendas !== null && last_corr3 && last_db3 && last_ger3) {
              const mk = parseExcelDate(last_db3);
              const g = String(last_ger3).replace(/^\+\s*/, '').trim();
              const nome = String(last_corr3).replace(/^\+\s*/, '').trim();
              const loja = String(last_loja3 || '').replace(/^\+\s*/, '').trim();

              if(mk && nome) {
                  if(!vendasPorNomeMes[nome]) vendasPorNomeMes[nome] = {};
                  vendasPorNomeMes[nome][mk] = (vendasPorNomeMes[nome][mk]||0) + vendas;
                  lojaPorNome[nome] = loja;
                  if(!parentPorNomeMes[nome]) parentPorNomeMes[nome] = {};
                  parentPorNomeMes[nome][mk] = g;
              }
          }
      }
  }

  const houseNames = new Set(Object.keys(house));
  const corretoresPorGerenteMes = {}, vendasPorGerenteMes = {}, produtivosPorGerenteMes = {};
  
  Object.keys(parentPorNomeMes).forEach(nome => {
      Object.keys(parentPorNomeMes[nome]).forEach(mk => {
          const parent = parentPorNomeMes[nome][mk];

          if(nome === 'WELLINGHTON CESAR PEREIRA FIGUEIREDO') return;
          if(parent === 'TIAGO AUGUSTO DA COSTA' && lojaPorNome[nome] !== 'HIBRIDA CREDENCIADA CAMPINAS 5') return;

          if(houseNames.has(parent)){
              const v = (vendasPorNomeMes[nome] && vendasPorNomeMes[nome][mk]) || 0;
              if(!vendasPorGerenteMes[parent]) vendasPorGerenteMes[parent] = {};
              if(!produtivosPorGerenteMes[parent]) produtivosPorGerenteMes[parent] = {};
              if(!corretoresPorGerenteMes[parent]) corretoresPorGerenteMes[parent] = {};

              vendasPorGerenteMes[parent][mk] = (vendasPorGerenteMes[parent][mk]||0) + v;
              produtivosPorGerenteMes[parent][mk] = (produtivosPorGerenteMes[parent][mk]||0) + 1;
              if(!corretoresPorGerenteMes[parent][mk]) corretoresPorGerenteMes[parent][mk] = [];
              corretoresPorGerenteMes[parent][mk].push({nome:nome, loja:lojaPorNome[nome], vendas:v});
          }
      });
  });

  function buildEntries(map, isHouse){
      return Object.keys(map).map(name => {
          const info = map[name];
          const entry = {nome:name, regional:info.regional, months: info.months};
          if(isHouse){
              entry.equipe_por_mes = equipe[name] || {};
              entry.vendas_por_mes = vendasPorGerenteMes[name] || {};
              entry.produtivos_por_mes = produtivosPorGerenteMes[name] || {};
              entry.corretores_por_mes = corretoresPorGerenteMes[name] || {};
          } else {
              entry.vendas_por_mes = vendasPorNomeMes[name] || {};
          }
          return entry;
      });
  }

  return { house: buildEntries(house, true), imob: buildEntries(imob, false), stages: STAGE_KEYS, stage_labels: STAGE_LABELS_STATIC };
}

function showToast(msg, duration){
  let t = document.getElementById('appToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'appToast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=> t.classList.add('show'));
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=> t.classList.remove('show'), duration || 3500);
}

async function copyRankingImage(){
  const el = document.getElementById('captureArea');
  const btn = document.getElementById('btnCopyImage');
  if(!el || !btn) return;
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Gerando imagem...';
  try{
    const canvas = await html2canvas(el, {
      scale: Math.max(2, window.devicePixelRatio || 1),
      backgroundColor: '#EEF2EF',
      useCORS: true
    });
    canvas.toBlob(async (blob)=>{
      if(!blob){
        showToast('Não foi possível gerar a imagem.');
        btn.disabled = false; btn.textContent = originalLabel;
        return;
      }
      try{
        if(navigator.clipboard && window.ClipboardItem){
          await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
          showToast('Imagem copiada! Já pode colar (Ctrl+V) no e-mail.');
        } else {
          throw new Error('sem-clipboard-api');
        }
      }catch(err){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ranking_${CANAL}_${new Date().toISOString().slice(0,10)}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Não foi possível copiar automaticamente — a imagem foi baixada.');
      } finally {
        btn.disabled = false; btn.textContent = originalLabel;
      }
    }, 'image/png');
  }catch(err){
    showToast('Erro ao gerar a imagem: ' + err.message);
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

function initApp(){
  const srcInfo = window.__DATA_SOURCE__;
  const statusEl0 = document.getElementById('uploadStatus');
  if(srcInfo && statusEl0){
    if(srcInfo.source === 'github'){
      statusEl0.textContent = `✅ Dados carregados do GitHub em ${new Date().toLocaleString('pt-BR')} · ${RAW.house.length} gerentes · ${RAW.imob.length} supervisores`;
      statusEl0.style.color = '';
    } else {
      statusEl0.textContent = `⚠️ Não foi possível carregar do GitHub (${srcInfo.reason || 'motivo desconhecido'}) — exibindo dados locais de segurança.`;
      statusEl0.style.color = '#b23b3b';
    }
  }
  function setCanal(newCanal, activeBtnId){
    CANAL = newCanal; regionalFilter='ALL'; expandedRow=null;
    
    document.getElementById('btnHouse').classList.toggle('active', 'btnHouse' === activeBtnId);
    document.getElementById('btnImob').classList.toggle('active', 'btnImob' === activeBtnId);
    document.getElementById('btnRankHouse').classList.toggle('active', 'btnRankHouse' === activeBtnId);
    document.getElementById('btnRankImob').classList.toggle('active', 'btnRankImob' === activeBtnId);
    
    renderAll();
  }
  
  document.getElementById('btnHouse').addEventListener('click', ()=> setCanal('house','btnHouse'));
  document.getElementById('btnImob').addEventListener('click', ()=> setCanal('imob','btnImob'));
  
  document.getElementById('btnRankMenu').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('rankDropdown').classList.toggle('show');
  });
  
  window.addEventListener('click', function(e) {
    if (!e.target.matches('#btnRankMenu')) {
      const dropdowns = document.getElementsByClassName("dropdown-content");
      for (let i = 0; i < dropdowns.length; i++) {
        if (dropdowns[i].classList.contains('show')) {
          dropdowns[i].classList.remove('show');
        }
      }
    }
  });

  document.getElementById('btnRankHouse').addEventListener('click', ()=>{
    setCanal('rank_house','btnRankHouse');
    document.getElementById('rankDropdown').classList.remove('show');
  });
  document.getElementById('btnRankImob').addEventListener('click', ()=>{
    setCanal('rank_imob','btnRankImob');
    document.getElementById('rankDropdown').classList.remove('show');
  });

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchTerm = e.target.value; expandedRow=null; renderAll();
  });
  document.getElementById('metaInput').addEventListener('input', (e)=>{
    meta = parseFloat(e.target.value) || 0; renderAll();
  });
  document.getElementById('btnUpload').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('btnCopyImage').addEventListener('click', copyRankingImage);
  
  document.getElementById('fileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt)=>{
      try{
        const data = parseWorkbook(evt.target.result);
        if(data.house.length===0 && data.imob.length===0){
          throw new Error('Nenhum dado reconhecido — verifique a estrutura da planilha (aba "TD Painel").');
        }
        RAW = data;
        expandedRow = null; regionalFilter = 'ALL';
        document.getElementById('uploadStatus').textContent = `Atualizado com "${file.name}" em ${new Date().toLocaleString('pt-BR')}`;
        initMonthSelector();
        renderAll();
      }catch(err){
        alert('Não foi possível ler a planilha: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  });

  // --- INÍCIO: SELETOR DE MÊS ---
  function initMonthSelector() {
    const select = document.getElementById('monthSelector');
    const monthsSet = new Set();
    
    if (RAW.house) RAW.house.forEach(h => Object.keys(h.months || {}).forEach(m => monthsSet.add(m)));
    if (RAW.imob) RAW.imob.forEach(i => Object.keys(i.months || {}).forEach(m => monthsSet.add(m)));
    
    let monthsArray = Array.from(monthsSet).sort();
    
    CURRENT_MONTH = monthKeyFromDate(new Date()); 
    if (!monthsArray.includes(CURRENT_MONTH)) {
      monthsArray.push(CURRENT_MONTH);
      monthsArray.sort();
    }
    
    PREV_3_MONTHS = [addMonths(CURRENT_MONTH,-3), addMonths(CURRENT_MONTH,-2), addMonths(CURRENT_MONTH,-1)];

    select.innerHTML = monthsArray.map(mk => {
      return `<option value="${mk}" style="color:#12201A; font-weight:500;">${monthLabel(mk)}</option>`;
    }).join('');
    
    select.value = CURRENT_MONTH;
    
    select.onchange = (e) => {
      CURRENT_MONTH = e.target.value;
      PREV_3_MONTHS = [addMonths(CURRENT_MONTH,-3), addMonths(CURRENT_MONTH,-2), addMonths(CURRENT_MONTH,-1)];
      expandedRow = null; 
      
      const realCurrent = monthKeyFromDate(new Date());
      if (CURRENT_MONTH === realCurrent) {
        meta = Math.max(0, new Date().getDate() - 1);
        document.getElementById('metaNote').textContent = `Meta automática: dia atual (${new Date().getDate()}) − 1`;
      } else {
        const [y, m] = CURRENT_MONTH.split('-').map(Number);
        meta = new Date(y, m, 0).getDate();
        document.getElementById('metaNote').textContent = `Mês fechado: meta considera todos os dias`;
      }
      document.getElementById('metaInput').value = meta;
      
      renderAll();        
    };
  }
  
  initMonthSelector();
  // --- FIM: SELETOR DE MÊS ---

  renderAll();
}
</script>
